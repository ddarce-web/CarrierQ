[project]
name = "parcelaudit"
version = "0.1.0"
description = "Audit parcel carrier invoices against contract rate cards and shipment data"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
llm = ["anthropic>=2.0", "pypdf>=4.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
parcelaudit = "parcelaudit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["parcelaudit*"]

[tool.setuptools.package-data]
parcelaudit = ["templates/*.html"]
